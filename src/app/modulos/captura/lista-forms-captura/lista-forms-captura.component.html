<mat-card>
  <h2>Formularios de Captura</h2>

  @if (mensaje()) {
    <div style="margin: 12px 0; padding: 10px; border: 1px solid #cce; background: #eef">
      {{ mensaje() }}
    </div>
  }

  <div style="display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end">
    <mat-form-field appearance="outline">
      <mat-label for="nombreFormulario">Nombre del formulario</mat-label>
      <input matInput id="nombreFormulario" [(ngModel)]="filtroFormulario" />
    </mat-form-field>
    <br />
    <div style="display: flex; gap: 8px">
      <button mat-raised-button (click)="consultarFormularios()">Consultar Formularios</button>

      <button mat-stroked-button (click)="verReporte()">Ver Reporte</button>
    </div>
  </div>

  <div style="margin-top: 12px">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z1">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let row" [title]="row.title">
          {{ row.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="editar">
        <th mat-header-cell *matHeaderCellDef>¿Editar?</th>
        <td mat-cell *matCellDef="let row">
          <button mat-button (click)="editar(row)" [title]="row.title">Editar</button>
        </td>
      </ng-container>

      <ng-container matColumnDef="diligenciar">
        <th mat-header-cell *matHeaderCellDef>¿Diligenciar?</th>
        <td mat-cell *matCellDef="let row">
          <button mat-button (click)="diligenciar(row)" [title]="row.title">Diligenciar</button>
        </td>
      </ng-container>

      <ng-container matColumnDef="consultar">
        <th mat-header-cell *matHeaderCellDef>¿Consultar?</th>
        <td mat-cell *matCellDef="let row">
          <button mat-button (click)="consultar(row)" [title]="row.title">Consultar</button>
        </td>
      </ng-container>

      <ng-container matColumnDef="eliminar">
        <th mat-header-cell *matHeaderCellDef>¿Eliminar?</th>
        <td mat-cell *matCellDef="let row">
          <button mat-button color="warn" (click)="eliminar(row)" [title]="row.title">
            Eliminar
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [length]="total()"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20, 50, 100]"
      (page)="pageChanged($event)"
    >
    </mat-paginator>
  </div>
</mat-card>

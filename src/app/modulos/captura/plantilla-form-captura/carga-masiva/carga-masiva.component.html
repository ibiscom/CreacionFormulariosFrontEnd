<div [style]="cargaMasivaEntity!.styleContenedor">
	<div class="file-upload-box">
		<input type="file" class="inputFileField" (change)="onFileSelected(cargaMasivaEntity!, $event)" />
		@if (uploadedFiles[componentKey(cargaMasivaEntity!)]) {
		<span class="smallLabelTexto">{{ uploadedFiles[componentKey(cargaMasivaEntity!)] }}</span>
		}
	</div>
</div>

<div style="display: inline-flex; flex-direction: row; width: calc(100% - 10px);">
  <span [class]="matLabelClasses">{{ inPutTextAreaEntity?.nombre }}</span>
  <mat-form-field [class]="'base-inputtextarea-field ' + matInputClasses" [style]="inPutTextAreaEntity!.styleContenedor" subscriptSizing="dynamic">
    <textarea
      matInput
      [placeholder]="inPutTextAreaEntity!.nombre"
      [required]="inPutTextAreaEntity?.obligatorio === 'true'"
      [readonly]="inPutTextAreaEntity?.readOnly === 'true'"
      [style]="inPutTextAreaEntity?.style"
      [value]="valorInput"
      (input)="updateValue($any($event.target).value)"
      [class]="inPutTextAreaEntity?.columnClasses?.replaceAll(',', ' ')"
    ></textarea>
  </mat-form-field>
</div>

@if (selectOneListBoxEntityVisible) {
  <div style="display: inline-flex; flex-direction: row; width: calc(100% - 10px);">
    <span [class]="matLabelClasses">{{ selectOneListBoxEntity?.nombre }}</span>
    <mat-form-field class="base-select-one-list-box-field" [style]="selectOneListBoxEntity!.styleContenedor">
      <mat-select
        [value]="selectedValue"
        (valueChange)="updateValue($event)"
        [panelClass]="'frm-purple-select-panel'"
        [class]="matInputClasses"`
      >
        @for (opcion of options; track opcion.value) {
          @if (selected(opcion)) {
            <mat-option [value]="opcion?.value" selected>{{ opcion?.label }}</mat-option>
          } @else {
            <mat-option [value]="opcion?.value">{{ opcion?.label }}</mat-option>
         }
        }
      </mat-select>
    </mat-form-field>
  </div>
}

<div style="display: inline-flex; flex-direction: row; width: calc(100% - 10px);">
  <span [class]="matLabelClasses">{{ inPutTextEntity?.nombre }}</span>
  <mat-form-field [class]="'base-inputtext-field ' + matInputClasses" subscriptSizing="dynamic">
    <input
      matInput
      [placeholder]="inPutTextEntity!.nombre"
      [required]="inPutTextEntity?.obligatorio === 'true'"
      [readonly]="inPutTextEntity?.readOnly === 'true'"
      [style]="inPutTextEntity?.style"
      [value]="valorInput"
      [class]="inPutTextEntity?.claseEstilo"
    />
  </mat-form-field>
</div>

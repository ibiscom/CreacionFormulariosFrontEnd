<div [style]="sanitizedContainerStyle()">
  <mat-label>{{ inPutRichTextEntity?.nombre }}</mat-label>
  @if (isBrowser && editor) {
    <ckeditor
      [config]="editorConfig"
      (ready)="onReady($event)"
      (change)="onEditorChange($event)"
      [editor]="editor"
      [data]="editorData"
      [disabled]="inPutRichTextEntity?.readOnly === 'true'"
      [style]="sanitizedStyle()"
      [class]="inPutRichTextEntity?.columnClasses?.replaceAll(',', ' ')"
    />
  }
  @if (!isBrowser || !editor) {
    <textarea
      matInput
      [value]="editorData"
      (input)="onTextareaInput($event)"
      [disabled]="inPutRichTextEntity?.readOnly === 'true'"
      [style]="sanitizedStyle()"
      [class]="inPutRichTextEntity?.columnClasses?.replaceAll(',', ' ')"
      placeholder="Rich text editor loading..."
      rows="4">
    </textarea>
  }
</div>

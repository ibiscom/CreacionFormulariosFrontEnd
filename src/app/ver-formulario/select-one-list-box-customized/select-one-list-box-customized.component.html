<mat-form-field [style]="selectOneListBoxCustomizedEntity!.styleContenedor">
  <mat-label>{{ selectOneListBoxCustomizedEntity!.nombre }}</mat-label>
  <mat-select>
    @for (opcion of selectOneListBoxCustomizedEntity!.opciones; track opcion) {
      @if (selected(opcion)) {
        <mat-option [value]="opcion" selected>{{ opcion }}</mat-option>
      } @else {
        <mat-option [value]="opcion">{{ opcion }}</mat-option>
      }
    }
  </mat-select>
</mat-form-field>
